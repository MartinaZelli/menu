services:
  app:
   # image: menu_app:latest
    container_name: menu_app_container
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - menu-network
    #volumes:
    #  - .:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      # Password per l'utente root (obbligatoria per il container)
      - MYSQL_ROOT_PASSWORD=rootpassword
      # Creazione del database all'avvio
      - MYSQL_DATABASE=menu_progetto
      # Creazione dell'utente dedicato
      - MYSQL_USER=menu
      - MYSQL_PASSWORD=menu
    ports:
      - "3306:3306"
    networks:
      - menu-network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  db_data:

networks:
  menu-network:
    driver: bridge
